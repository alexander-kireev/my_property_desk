<div class="modal fade"
     id="editIssueTaskModal"
     data-modal-clear-query="form_state"
     tabindex="-1"
     aria-labelledby="editIssueTaskModalLabel"
     aria-hidden="true">
    <div class="task-form-dialog modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="editIssueTaskModalLabel">Edit task</h2>
                <button class="btn-close"
                        type="button"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <form id="editIssueTaskForm"
                  action="{% if edit_task %}{% url 'issue:edit_issue_task' selected_issue.pk edit_task.pk %}{% else %}#{% endif %}"
                  method="post"
                  data-task-form>
                {% csrf_token %}
                <div class="modal-body p-4">{% include "task/includes/task_form_fields.html" with task_form=edit_task_form %}</div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary"
                            type="button"
                            data-bs-dismiss="modal">Cancel</button>
                    <button class="btn theme-action" type="submit">Save changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

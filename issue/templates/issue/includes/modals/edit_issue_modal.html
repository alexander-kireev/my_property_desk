<div class="modal fade"
     id="editIssueModal"
     data-modal-clear-query="form_state open"
     tabindex="-1"
     aria-labelledby="editIssueModalLabel"
     aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="editIssueModalLabel">Edit issue</h2>
                <button class="btn-close"
                        type="button"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <form action="{% url 'issue:edit_issue' selected_issue.pk %}{% if navigation_query %}?{{ navigation_query }}{% endif %}"
                  method="post">
                {% csrf_token %}
                <div class="modal-body p-4">{% include "issue/includes/issue_form_fields.html" with issue_form=edit_issue_form %}</div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary"
                            type="button"
                            data-bs-dismiss="modal">Cancel</button>
                    <button class="btn theme-action" type="submit">Save changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

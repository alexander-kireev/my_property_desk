<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="695" viewBox="0 0 1000 695" role="img" aria-labelledby="title desc">
  <title id="title">Adding a task: success and validation error</title>
  <desc id="desc">The browser submits the Add task form to the Django task view. The view binds a TaskForm with user-scoped choices and validates it. Valid input creates a task and redirects to a refreshed task page. Invalid input is held briefly in the session, redirected back, and shown with errors in the Add task modal.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#647b66"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #25352a; }
      .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 1.1px; fill: #49644d; }
      .node { font-size: 17px; font-weight: 600; text-anchor: middle; }
      .sub { font-size: 13px; font-weight: 400; fill: #536557; text-anchor: middle; }
      .line { stroke: #647b66; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .box { fill: #fff; stroke: #9cad9a; stroke-width: 1.5; rx: 10; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>
  <text class="eyebrow" x="32" y="29">ADD A TASK</text>
  <rect class="box" x="315" y="45" width="370" height="56"/>
  <text class="node" x="500" y="69"><tspan x="500">GET /tasks/ renders the Add task form</tspan><tspan class="sub" x="500" dy="18">the browser submits that form</tspan></text>
  <path class="line" d="M500 103 V129"/>
  <rect class="box" x="315" y="133" width="370" height="56"/>
  <text class="node" x="500" y="157"><tspan x="500">POST /tasks/add/</tspan><tspan class="sub" x="500" dy="18">login and CSRF checks, then add_task_view</tspan></text>
  <path class="line" d="M500 191 V217"/>
  <rect class="box" x="315" y="221" width="370" height="56"/>
  <text class="node" x="500" y="245"><tspan x="500">Bind TaskForm to submitted data</tspan><tspan class="sub" x="500" dy="18">property and issue choices belong to this user</tspan></text>
  <path class="line" d="M500 279 V305"/>
  <polygon points="500,309 585,347 500,385 415,347" fill="#e8f0e6" stroke="#5c7a60" stroke-width="1.5"/>
  <text class="node" x="500" y="353">Valid?</text>

  <rect x="32" y="410" width="450" height="265" rx="14" fill="#f7f9f4" stroke="#c8d5c4"/>
  <rect x="518" y="410" width="450" height="265" rx="14" fill="#f8f9f8" stroke="#c8d5c4"/>
  <text class="eyebrow" x="50" y="434">YES · TASK CREATED</text>
  <text class="eyebrow" x="536" y="434">NO · FORM ERRORS</text>
  <path class="line" d="M415 347 H257 V444"/>
  <path class="line" d="M585 347 H743 V444"/>
  <text class="sub" x="330" y="365">yes</text>
  <text class="sub" x="670" y="365">no</text>

  <rect class="box" x="52" y="453" width="410" height="47"/>
  <rect class="box" x="52" y="532" width="410" height="47"/>
  <rect class="box" x="52" y="611" width="410" height="47"/>
  <text class="node" x="257" y="482">create_task saves the record in PostgreSQL</text>
  <text class="node" x="257" y="554"><tspan x="257">Success message and redirect</tspan><tspan class="sub" x="257" dy="17">to the task or property view</tspan></text>
  <text class="node" x="257" y="632"><tspan x="257">Fresh GET re-queries and renders</tspan><tspan class="sub" x="257" dy="17">the newly selected task</tspan></text>
  <path class="line" d="M257 502 V528"/>
  <path class="line" d="M257 581 V607"/>

  <rect class="box" x="538" y="453" width="410" height="47"/>
  <rect class="box" x="538" y="532" width="410" height="47"/>
  <rect class="box" x="538" y="611" width="410" height="47"/>
  <text class="node" x="743" y="482">Submitted values are held in session state</text>
  <text class="node" x="743" y="561">Redirect to task page with a one-use token</text>
  <text class="node" x="743" y="632"><tspan x="743">Fresh GET restores the bound form</tspan><tspan class="sub" x="743" dy="17">errors appear in the Add task modal</tspan></text>
  <path class="line" d="M743 502 V528"/>
  <path class="line" d="M743 581 V607"/>
</svg>

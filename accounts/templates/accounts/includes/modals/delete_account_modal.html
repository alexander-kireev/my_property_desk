<div class="modal fade"
     id="deleteAccountModal"
     tabindex="-1"
     aria-labelledby="deleteAccountTitle"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="deleteAccountTitle">Delete your account?</h2>
                <button class="btn-close"
                        type="button"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>This permanently deletes your account and all its properties, contacts, tasks, issues, events and notes.</p>
                <p class="fw-medium mb-0">This action cannot be undone.</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline-secondary"
                        type="button"
                        data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-outline-danger"
                        type="button"
                        data-bs-toggle="modal"
                        data-bs-target="#deleteAccountConfirmModal">Continue</button>
            </div>
        </div>
    </div>
</div>

{% extends "public_base.html" %}
{% block title %}Password reset complete · My Property Desk{% endblock %}
{% block content %}

        <div class="auth-head">
            <h1>Your password has been changed.</h1>
            <p>You can now sign in with your new password.</p>
        </div>
        <div class="panel auth-card">
            <a class="button primary" href="{% url 'accounts:login' %}">Sign in</a>
        </div>
    </section>
{% endblock %}

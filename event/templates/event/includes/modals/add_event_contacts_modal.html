<div class="modal fade"
     id="addEventContactsModal"
     data-modal-clear-query="form_state"
     tabindex="-1"
     aria-labelledby="addEventContactsModalLabel"
     aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="addEventContactsModalLabel">Add participants</h2>
                <button class="btn-close"
                        type="button"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <form action="{% url 'event:add_event_contacts_to_event' selected_event.pk %}{% if navigation_query %}?{{ navigation_query }}{% endif %}"
                  method="post">
                <div class="modal-body">
                    {% csrf_token %}
                    {% include "event/includes/contact_picker.html" with picker_field=add_contacts_form.contacts picker_id="eventContacts" %}
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary"
                            type="button"
                            data-bs-dismiss="modal">Cancel</button><button class="btn theme-action" type="submit">Add participants</button>
                </div>
            </form>
        </div>
    </div>
</div>

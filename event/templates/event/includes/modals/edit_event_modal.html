<div class="modal fade"
     id="editEventModal"
     data-modal-clear-query="form_state open"
     tabindex="-1"
     aria-labelledby="editEventModalLabel"
     aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable dashboard-add-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="editEventModalLabel">Edit event</h2>
                <button class="btn-close"
                        type="button"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <form class="event-tabbed-form"
                  action="{% url 'event:edit_event' selected_event.pk %}{% if navigation_query %}?{{ navigation_query }}{% endif %}"
                  method="post"
                  autocomplete="off"
                  data-event-form
                  data-event-tabs>
                {% csrf_token %}
                <input type="hidden" name="manage_contacts" value="1">
                {% include "event/includes/tabbed_form_body.html" with id_prefix="editEvent" tab_label="Edit event sections" event_form=edit_event_form contacts_form=edit_contacts_form picker_id="editEventContacts" picker_mode="edit" only %}
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary"
                            type="button"
                            data-bs-dismiss="modal">Cancel</button><button class="btn theme-action px-4" type="submit">Save changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

[tool.djlint]
profile = "django"
indent = 4
max_line_length = 120
preserve_blank_lines = true
ignore = "H020,H023,H054"
per-file-ignores = { 'navbar\.html$' = "H053" }
exclude = ".venv,.worktrees,internal,static/vendor"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["**/migrations/**", "internal", ".worktrees", "static/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

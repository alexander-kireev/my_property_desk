{% load static %}
<footer class="app-footer border-top border-secondary text-light py-4"
        data-bs-theme="dark">
    <div class="container-fluid d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 px-5">
        <img class="app-footer-logo"
             src="{% static 'brand/mpd-compact-georgia-dark.svg' %}"
             alt="My Property Desk"
             width="157"
             height="66">
        <span class="small text-light-emphasis">A lighter way to manage property work</span>
        <nav class="d-flex gap-3 small" aria-label="Footer navigation">
            <a class="footer-link text-light-emphasis"
               href="{% url 'pages:about_us' %}">About</a>
            <a class="footer-link text-light-emphasis"
               href="{% url 'pages:contact_us' %}">Contact</a>
            <a class="footer-link text-light-emphasis"
               href="{% url 'pages:privacy_policy' %}">Privacy</a>
        </nav>
    </div>
</footer>

{# The caller supplies an external label with id locked_id + "Label". This display does not submit the relation; the form owns its value. #}
<div class="form-control modal-locked-relation{% if property_context %} property-context-readonly{% endif %}"
     id="{{ locked_id }}"
     role="note"
     tabindex="0"
     aria-labelledby="{{ locked_id }}Label">{{ locked_value }}</div>

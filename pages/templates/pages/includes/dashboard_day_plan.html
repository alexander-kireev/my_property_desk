{# Selected day plan #}
<section class="dashboard-day-plan"
         id="dayView"
         role="tabpanel"
         aria-labelledby="dayViewToggle">
    <div class="dashboard-day-heading">
        <span class="dashboard-day-heading-copy"><strong id="selectedDayHeading"></strong><span id="selectedDayCount"></span></span>
    </div>
    <div class="dashboard-tabs dashboard-day-tabs nav nav-underline"
         role="tablist"
         aria-label="Selected day records">
        <button class="nav-link active"
                type="button"
                id="dayTabTasks"
                data-day-tab="tasks"
                role="tab"
                aria-selected="true"
                aria-controls="dayList">Tasks <span class="badge text-bg-secondary" data-day-count="tasks">0</span></button>
        <button class="nav-link"
                type="button"
                id="dayTabDeadlines"
                data-day-tab="deadlines"
                role="tab"
                aria-selected="false"
                aria-controls="dayList">Deadlines <span class="badge text-bg-secondary" data-day-count="deadlines">0</span></button>
        <button class="nav-link"
                type="button"
                id="dayTabEvents"
                data-day-tab="events"
                role="tab"
                aria-selected="false"
                aria-controls="dayList">Events <span class="badge text-bg-secondary" data-day-count="events">0</span></button>
    </div>
    <div class="dashboard-day-list list-group list-group-flush"
         id="dayList"
         role="tabpanel"
         aria-labelledby="dayTabTasks"
         aria-live="polite"></div>
</section>

{# Month calendar #}
<section class="dashboard-panel dashboard-calendar" aria-label="Calendar">
    <h2 class="dashboard-panel-heading">Calendar</h2>
    <div class="dashboard-calendar-toolbar">
        <div class="dashboard-calendar-jump">
            <label class="visually-hidden" for="calendarMonth">Calendar month</label>
            <select class="form-select form-select-sm"
                    id="calendarMonth"
                    aria-label="Calendar month"></select>
            <label class="visually-hidden" for="calendarYear">Calendar year</label>
            <select class="form-select form-select-sm"
                    id="calendarYear"
                    aria-label="Calendar year"></select>
            <button id="calendarToday"
                    class="btn btn-outline-secondary btn-sm"
                    type="button">Today</button>
        </div>
        <div class="dashboard-calendar-actions">
            <button id="previousPeriod"
                    class="btn btn-outline-secondary btn-sm"
                    type="button"
                    aria-label="Previous month"
                    title="Previous month">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="m15 18-6-6 6-6" />
                </svg>
            </button>
            <button id="nextPeriod"
                    class="btn btn-outline-secondary btn-sm"
                    type="button"
                    aria-label="Next month"
                    title="Next month">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="m9 18 6-6-6-6" />
                </svg>
            </button>
        </div>
    </div>
    <fieldset class="dashboard-calendar-filters" aria-label="Show on calendar">
        <label>
            <input class="form-check-input"
                   type="checkbox"
                   data-calendar-filter="tasks"
                   checked>
            Tasks
        </label>
        <label>
            <input class="form-check-input"
                   type="checkbox"
                   data-calendar-filter="issues"
                   checked>
            Issue deadlines
        </label>
        <label>
            <input class="form-check-input"
                   type="checkbox"
                   data-calendar-filter="events"
                   checked>
            Events
        </label>
    </fieldset>
    <div class="dashboard-calendar-body">
        <div class="dashboard-calendar-grid"
             id="calendarGrid"
             aria-label="Calendar dates"></div>
    </div>
</section>

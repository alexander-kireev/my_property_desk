{# deactivate Contact Modal; visibility is controlled by the parent dialog collection. #}
<div class="modal fade modal-resilient"
     id="deactivateContactModal"
     tabindex="-1"
     aria-labelledby="deactivateContactModalLabel"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="deactivateContactModalLabel">Deactivate contact?</h2>
                <button class="btn-close"
                        type="button"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>The contact will become read-only and remain available as history.</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline-secondary"
                        type="button"
                        data-bs-dismiss="modal">Keep contact</button>
                <form action="{% url 'contact:deactivate_contact' selected_contact.pk %}{% if navigation_query %}?{{ navigation_query }}{% endif %}"
                      method="post">
                    {% csrf_token %}
                    <button class="btn theme-action" type="submit">Deactivate contact</button>
                </form>
            </div>
        </div>
    </div>
</div>

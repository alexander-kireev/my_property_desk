{# edit Contact Modal; visibility is controlled by the parent dialog collection. #}
<div class="modal fade modal-resilient"
     id="editContactModal"
     data-modal-clear-query="form_state"
     tabindex="-1"
     aria-labelledby="editContactModalLabel"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="editContactModalLabel">Edit contact</h2>
                <button class="btn-close"
                        type="button"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <form action="{% url 'contact:edit_contact' selected_contact.pk %}{% if navigation_query %}?{{ navigation_query }}{% endif %}"
                  method="post"
                  autocomplete="off">
                <div class="modal-body">
                    {% csrf_token %}
                    {% include "contact/includes/contact_form_fields.html" with contact_form=edit_contact_form only %}
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary"
                            type="button"
                            data-bs-dismiss="modal">Cancel</button><button class="btn theme-action" type="submit">Save changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
